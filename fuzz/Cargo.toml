[package]
name = "mongodb-vs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mongodb-vs = { path = "../crates/mongodb-vs" }
serde_json = "1"

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan_spec_parse"
path = "fuzz_targets/scan_spec_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pushdown_plan"
path = "fuzz_targets/pushdown_plan.rs"
test = false
doc = false
bench = false

# Keep nightly/libFuzzer dependencies out of the stable production workspace.
[workspace]
members = ["."]
