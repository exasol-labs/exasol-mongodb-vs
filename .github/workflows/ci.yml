name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          cargo install cargo-llvm-cov --version 0.8.4 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Run quality gate
        run: make quality
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  linux-artifact:
    name: Linux UDF artifact (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and verify Linux UDF
        run: make build-so verify-so VERIFY_PLATFORM=${{ matrix.platform }}
      - name: Upload verified Linux UDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mongodb-vs-${{ matrix.platform }}-udf-${{ github.sha }}
          path: target/release/libmongodb_vs.so
          if-no-files-found: error
          retention-days: 7

  mongodb-integration:
    name: MongoDB inference integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: make test-integration

  # Live acceptance against Exasol Personal. On Linux the database runs
  # directly in Podman on the runner; MongoDB runs in Docker and is reached
  # through the Docker bridge gateway.
  exasol-e2e:
    name: Exasol Personal end-to-end
    needs: linux-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXASOL_PERSONAL_VERSION: 2.3.0
      EXASOL_PERSONAL_SHA256: 78000e784689a0c4234f085c8e5e3ee21fb36e62b02d087f325cb86119867266
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download verified Linux UDF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mongodb-vs-linux-x86_64-udf-${{ github.sha }}
          path: target/release
      - name: Install pinned Exasol Personal launcher
        run: |
          archive=exasol-personal_Linux_x86_64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/exasol/exasol-personal/releases/download/v${EXASOL_PERSONAL_VERSION}/$archive"
          echo "$EXASOL_PERSONAL_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" exasol
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy Exasol Personal
        run: |
          podman --version
          exasol install local --auto-approve
          exasol info
      - name: Register the Rust SLC matching the SDK pin
        # `exasol slc install rust` always takes the newest release; the
        # artifact only loads in the SLC whose fingerprint it was built for.
        # The bucket staging in run_e2e.sh restarts the deployment, which
        # activates this SLC as well.
        run: |
          sdk_version="$(awk '$0 == "name = \"exasol-udf-sdk\"" { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          exasol slc custom install --no-restart --alias RUST --language rust \
            --source "https://github.com/exasol-labs/language-container-rs/releases/download/v${sdk_version}/lc-rust-${sdk_version}.tar.gz"
      - name: Run end-to-end suite
        env:
          MONGODB_E2E_SKIP_BUILD: "1"
        run: |
          EXASOL_DEPLOYMENT_DIR="$(exasol info --json | jq -r '.deploymentDir')"
          MONGODB_E2E_GATEWAY="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          export EXASOL_DEPLOYMENT_DIR MONGODB_E2E_GATEWAY
          make test-e2e
      - name: Show Exasol deployment state
        if: failure()
        run: |
          exasol status || true
          exasol slc list || true
          podman ps -a || true
