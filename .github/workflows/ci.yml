name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          cargo install cargo-llvm-cov --version 0.8.4 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Run quality gate
        run: make quality
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  linux-artifact:
    name: Linux UDF artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and verify Linux UDF
        run: make build-so verify-so
      - name: Upload verified Linux UDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mongodb-vs-linux-udf-${{ github.sha }}
          path: target/release/libmongodb_vs.so
          if-no-files-found: error
          retention-days: 7

  mongodb-integration:
    name: MongoDB inference integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: make test-integration
